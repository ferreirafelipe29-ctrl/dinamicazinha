<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinâmica na Física - 2ª Lei de Newton</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Dinâmica na Física</h1>
    <p>Simulador da Segunda Lei de Newton: <strong>F = m · a</strong></p>
  </header>

  <main class="container">
    <section class="controls">
      <h2>Controles</h2>
      
      <!-- Controles da Segunda Lei de Newton -->
      <div class="input-group">
        <label for="force">Força (F): <span id="force-val">10</span> N</label>
        <input type="range" id="force" min="0" max="10000" value="10">
      </div>

      <div class="input-group">
        <label for="mass">Massa (m): <span id="mass-val">2</span> kg</label>
        <input type="range" id="mass" min="1" max="100" value="2">
      </div>

      <!-- Controles do Impacto no Vidro -->
      <div class="input-group controle-vidro">
        <label for="tipoVidro">Tipo de Vidro:</label>
        <select id="tipoVidro">
          <option value="40000000">Vidro Comum (40 MPa)</option>
          <option value="120000000">Vidro Temperado (120 MPa)</option>
          <option value="200000000">Vidro Blindado Leve (200 MPa)</option>
        </select>
      </div>

      <div class="input-group">
        <label for="areaContato">Área do Impacto (cm²):</label>
        <input type="number" id="areaContato" value="10" min="1" step="1">
      </div>

      <!-- Leituras do Simulador -->
      <div class="results">
        <p>Aceleração Calculada (a): <strong id="acc-val">5.00</strong> m/s²</p>
        <p>Velocidade Atual: <strong id="vel-val">0.00</strong> m/s</p>
        <p>Status do Vidro: <strong id="resultadoImpacto">Vidro Intacto</strong></p>
      </div>

      <div class="buttons">
        <button id="btn-start">Iniciar / Pausar</button>
        <button id="btn-reset">Resetar</button>
      </div>
    </section>

    <!-- Área de Animação -->
    <section class="simulation-area">
      <div id="track" class="cenario">
        <div id="box">Bloco</div>
        <div id="vidro" class="vidro-intacto">
          <span>Vidro</span>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
